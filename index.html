<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Estudos com flash cards e repetição espaçada: organize matérias, revise na hora certa e chegue na prova com tudo revisado.">
  <meta name="author" content="Isaacrdesouza">
  <meta name="theme-color" content="#0f1115">
  <meta name="color-scheme" content="dark light">

  <!-- Aplica o tema salvo antes de desenhar a página (evita "piscar" o tema errado) -->
  <script>
    (function () {
      var tema = 'escuro';
      try { tema = localStorage.getItem('flashcards-tema') || 'escuro'; } catch (e) {}
      if (tema === 'sistema') tema = window.matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
      document.documentElement.setAttribute('data-tema', tema);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', tema === 'claro' ? '#f4f5f8' : '#0f1115');
    })();
  </script>
  <title>Flash Cards · Estudos</title>

  <!-- Ícone da aba (arquivo local, sem dependências externas) -->
  <link rel="icon" href="assets/icone.svg" type="image/svg+xml">

  <!-- Estilos: base (variáveis e layout), componentes reutilizáveis, páginas e sessão de estudo -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas.css">

      </ul>
      <!-- Situação da sincronização com a nuvem (ver js/nuvem.js) -->

    </nav>

    <!-- Área onde cada página é desenhada pelo JavaScript (ver js/rotas.js) -->
